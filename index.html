<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berkeley Campus Walk</title>
<style>
  :root{
    --ink:#0e1116; --panel:rgba(16,20,27,.92); --line:rgba(255,255,255,.14);
    --text:#e8eaed; --dim:#9aa3af; --gold:#d8b45a; --blue:#3b6fa8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);
    color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block}

  /* loading */
  #load{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:60;
    transition:opacity .6s;text-align:center;padding:24px}
  #load.gone{opacity:0;pointer-events:none}
  #load h1{font-size:clamp(28px,5vw,46px);margin:0 0 6px;letter-spacing:-.02em}
  #load .sub{color:var(--gold);font-size:13px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:26px}
  #bar{width:min(320px,70vw);height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;margin:0 auto}
  #bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
  #pct{color:var(--dim);font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums}

  /* start / pause veil */
  /* below #dlg (30) and #map (40): those open by releasing pointer lock, and
     must not end up underneath the veil that release brings back */
  #veil{position:fixed;inset:0;display:grid;place-items:center;z-index:20;
    background:rgba(8,10,14,.72);backdrop-filter:blur(6px);cursor:pointer}
  #veil.hide{display:none}
  #veil .card{text-align:center;max-width:440px;padding:0 24px}
  #veil h2{margin:0 0 14px;font-size:26px;letter-spacing:-.01em}
  #veil p{color:var(--dim);margin:0 0 20px}
  kbd{display:inline-block;min-width:22px;padding:2px 7px;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;background:rgba(255,255,255,.06);
    font:600 12px ui-monospace,monospace;color:var(--text)}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;
    font-size:13.5px;color:var(--dim);margin:0 auto;width:max-content}

  /* hud */
  #crosshair{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
    border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none;z-index:10}
  #minimap{position:fixed;right:16px;top:16px;width:190px;height:190px;border-radius:10px;
    border:1px solid var(--line);pointer-events:none;z-index:12;
    box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #hint{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:14;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:9px 15px;font-size:14px;display:none;white-space:nowrap}
  #hint.on{display:block}
  #hint b{color:var(--gold);font-weight:600}
  #where{position:fixed;left:16px;bottom:16px;z-index:12;font-size:12px;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;
    font-variant-numeric:tabular-nums}

  /* labels floating over characters */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
    background:rgba(14,17,22,.82);border:1px solid var(--line);border-radius:7px;
    padding:3px 9px;font-size:12px;letter-spacing:.01em}
  .lbl small{color:var(--gold);display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase}

  /* dialog */
  #dlg{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:min(660px,92vw);
    background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px;
    z-index:30;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #dlg.on{display:block}
  #dlg .who{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  #dlg .dot{width:10px;height:10px;border-radius:50%;flex:none}
  #dlg .nm{font-weight:600}
  #dlg .at{color:var(--dim);font-size:12.5px}
  #dlg .say{min-height:52px;font-size:15.5px}
  #dlg .foot{display:flex;justify-content:space-between;align-items:center;
    margin-top:13px;font-size:12px;color:var(--dim)}
  #dlg button{background:var(--gold);color:#191308;border:0;border-radius:7px;
    padding:7px 15px;font:600 13px inherit;cursor:pointer}

  /* full map */
  #map{position:fixed;inset:0;z-index:40;display:none;background:rgba(8,10,14,.9);
    backdrop-filter:blur(3px)}
  #map.on{display:block}
  #mapwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.7)}
  #maphud{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
  .pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
    background:none;border:0;padding:0;font:inherit;color:inherit}
  .pin .head{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:4px 9px;font-size:12px;white-space:nowrap;transition:.15s}
  .pin .head b{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--gold);font-weight:600}
  .pin:hover .head{background:var(--gold);color:#191308;border-color:var(--gold)}
  .pin:hover .head b{color:#5a4410}
  .pin .stem{width:1px;height:9px;background:var(--line);margin:0 auto}
  .pin.student .head{border-color:#fdb515}
  .pin.student .head b{color:#fdb515}
  .pin.student:hover .head{background:#fdb515;color:#191308;border-color:#fdb515}
  .pin.student:hover .head b{color:#5a4410}
  .pin.student .stem{background:rgba(253,181,21,.45)}
  #you{position:absolute;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;
    background:var(--blue);border:2px solid #cfe0f2;box-shadow:0 0 0 4px rgba(59,111,168,.3)}
  #maptitle{position:absolute;left:16px;top:14px;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim)}
  #mapclose{position:absolute;right:14px;top:12px;pointer-events:auto;background:none;
    border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 11px;
    font:inherit;font-size:12px;cursor:pointer}
</style>
</head>
<body>

<div id="load">
  <div>
    <div class="sub">University of California</div>
    <h1>Berkeley Campus Walk</h1>
    <div id="bar"><i></i></div>
    <div id="pct">loading…</div>
  </div>
</div>

<div id="veil" class="hide"><div class="card">
  <h2>Explore the campus</h2>
  <p>Walk between landmarks and talk to the people you meet.</p>
  <div class="keys">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>move</span>
    <span><kbd>Shift</kbd></span><span>run</span>
    <span><kbd>Mouse</kbd></span><span>look around</span>
    <span><kbd>E</kbd></span><span>talk to someone</span>
    <span><kbd>M</kbd></span><span>open the campus map</span>
    <span><kbd>Esc</kbd></span><span>release the cursor</span>
  </div>
  <p style="margin-top:20px;font-size:13px">Click anywhere to begin</p>
</div></div>

<div id="crosshair"></div>
<canvas id="minimap" width="380" height="380"></canvas>
<div id="labels"></div>
<div id="hint"></div>
<div id="where"></div>

<div id="dlg">
  <div class="who"><span class="dot"></span><span class="nm"></span><span class="at"></span></div>
  <div class="say"></div>
  <div class="foot"><span class="pg"></span><button id="next">Continue</button></div>
</div>

<div id="map">
  <div id="mapwrap">
    <canvas id="mapcanvas"></canvas>
    <div id="maphud">
      <div id="maptitle">Campus Map</div>
      <button id="mapclose">Close · Esc</button>
      <div id="you"></div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
